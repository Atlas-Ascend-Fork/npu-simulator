name: PR-pipeline_npu-simulator

concurrency:
  max: 5
  exceed-action: QUEUE
  enable: true
  preemption:
    enable: true
    events: [mr_id]

on:
  workflow_dispatch:
  pull_request_comment:
    types: [created]
    branches: [ '**' ]
    comments: [ '^/?compile(@[A-Za-z0-9._-]+)?$' ]
  pr_comment:
    types: [ created ]
    keyword: '^/?compile(@[A-Za-z0-9._-]+)?$'

env:
  org_name: ${{ vars.ORG_NAME }}
  repo_name: ${{ atomgit.event.repository.name}}
  MERGE_ID: ${{ atomgit.event.pull_request.number }}
  TARGET_BRANCH: ${{ atomgit.base_ref }}
  SOURCE_BRANCH: ${{ atomgit.head_ref }}
  obs_path: "${{ env.org_name }}/${{ env.repo_name }}/ci/package/${{ env.MERGE_ID }}"
  online: ${{ vars.APPLY_LABEL }}

stages:
  stage1:
    name: PreBuild
    jobs:
      JOB_image:
        name: Test_image
        steps:
          - name: revise_image
            identifier: revise_image
            uses: cann/.gitcode/actions/revise-img@master
            with:
              repo_name: ${{ env.repo_name }}
              target_branch: ${{ env.TARGET_BRANCH }}
              repo_url: ${{ vars.CI_PATH }}
        runs-on: [self-hosted, arch=x64, spec=small]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/ubuntu20.04.05_x86:k8s_v1.1006
      JOB_pre:
        name: Test_PreBuild
        uses: cann/.gitcode/.gitcode/workflows/pre_action.yml@master
    pre:
    - type: auto
    fail-fast: true
  stage2:
    name: CodeCheck
    jobs:
      JOB_codecheck:
        name: CodeCheck
        uses: cann/.gitcode/.gitcode/workflows/codecheck_action.yml@master
        with:
          precommit_image_version: ${{ jobs.JOB_image.outputs.precommit }}
          codecheck_image_version: ${{ jobs.JOB_image.outputs.codecheck }}
      JOB_Compile_Ascend_X86_ubuntu24:
        name: Compile_Ascend_X86_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_X86_ubuntu24'
          package_name: 'cann-npu-simulator_linux-x86_64_ubuntu24.whl'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_X86_ubuntu24 }}
          arch: 'x64'
      JOB_Compile_Ascend_ARM_ubuntu24:
        name: Compile_Ascend_ARM_ubuntu24
        uses: .gitcode/workflows/compile_action.yml
        with:
          task_name: 'Compile_Ascend_ARM_ubuntu24'
          package_name: 'cann-npu-simulator_linux-aarch64_ubuntu24.whl'
          image_version: ${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_ubuntu24 }}
          arch: 'arm64'
      JOB_py37_compat:
        name: py37_compat
        uses: .gitcode/workflows/py37_compat_action.yml
        with:
          task_name: 'codecheck_py37_compat'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
      JOB_scan:
        name: scan
        uses: .gitcode/workflows/scan_action.yml
        with:
          task_name: 'codecheck_scan'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
    pre:
    - type: auto
    fail-fast: false
  stage3:
    name: UT
    jobs:
      JOB_UT_Test:
        name: UT_Test
        uses: .gitcode/workflows/llt_action.yml
        with:
          ut_type: 'UT_Test'
          ut_package: 'coverage_*.info'
          image_version: ${{ jobs.JOB_image.outputs.UT_Test }}
    pre:
    - type: auto
    fail-fast: false
  stage4:
    name: PreSmoke
    jobs:
      PreSmoke_x86:
        name: PreSmoke_x86
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/pre_smoke_for_action.sh
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: smoke
            identifier: compile
            uses: build-accelerate
            with:
              command: |
                export WORKSPACE=${{ steps.process_checkout.outputs.path }}
                cd ${{ steps.process_checkout.outputs.path }}
                export smoke_run_file_url=${{jobs.JOB_Compile_Ascend_X86_ubuntu24.outputs.arm_run_url}}
                export task_name=${{ inputs.task_name }}
                export ge_st_rt2=${{ inputs.ge_st_rt2 }}
                export GIT_TARGET_BRANCH=${{ env.TARGET_BRANCH }}
                export OS_TYPE=${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
                export ASCEND_3RD_LIB_PATH=/home/jenkins/opensource
                BuildAccelerate bash pre_smoke_for_action.sh
              AC_SERVER_IP: ${{ vars.AC_SERVER_IP }}
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: "${{ steps.process_checkout.outputs.path }}/slog*.tar.gz"
              object-prefix: ${obs_smoke_path}/plog/

        if: env.TARGET_BRANCH == 'master'
        runs-on: ["self-hosted", "arch=x64", "spec=xlarge"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Pre_smoke }}
      PreSmoke_arm:
        name: PreSmoke_arm
        steps:
          -
            name: Checkout
            identifier: process_checkout
            uses: checkout
            with:
              allow-unsafe-pr-checkout: true
              ref: ${{ atomgit.event.pull_request.merge_commit_sha }}
          -
            name: download
            uses: obs-download
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              key: |
                ${{ env.obs_path }}/pr_filelist.txt
                ${{ env.obs_path }}/pr_filelist_mod.txt
                ${{ env.obs_path }}/update_file_detail.txt
                ${{ env.obs_path }}/pre_smoke_for_action.sh
              path: ${{ steps.process_checkout.outputs.path }}
          -
            name: smoke
            identifier: compile
            uses: build-accelerate
            with:
              command: |
                export WORKSPACE=${{ steps.process_checkout.outputs.path }}
                cd ${{ steps.process_checkout.outputs.path }}
                export smoke_run_file_url=${{jobs.JOB_Compile_Ascend_ARM_ubuntu24.outputs.arm_run_url}}
                export task_name=${{ inputs.task_name }}
                export ge_st_rt2=${{ inputs.ge_st_rt2 }}
                export GIT_TARGET_BRANCH=${{ env.TARGET_BRANCH }}
                export OS_TYPE=${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
                export ASCEND_3RD_LIB_PATH=/home/jenkins/opensource
                BuildAccelerate bash pre_smoke_for_action.sh
              AC_SERVER_IP: ${{ vars.AC_SERVER_IP }}
          - name: upload
            uses: obs-upload
            with:
              endpoint: "https://obs.cn-north-4.myhuaweicloud.com"
              bucket: "ascend-ci"
              access-key: ${{ secrets.AK }}
              secret-key: ${{ secrets.SK }}
              artifact-path: "${{ steps.process_checkout.outputs.path }}/slog*.tar.gz"
              object-prefix: ${obs_smoke_path}/plog/

        if: env.TARGET_BRANCH == 'master'
        runs-on: ["self-hosted", "arch=arm64", "spec=xlarge"]
        container:
          image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ jobs.JOB_image.outputs.Compile_Ascend_ARM_ubuntu24 }}

    pre:
    - type: auto
    fail-fast: true
post:
  jobs:
    job_post:
      name: Test_post
      uses: cann/.gitcode/.gitcode/workflows/post_action.yml@master
