name: codecheck_action

on:
  workflow_call:
    inputs:
      codecheck_image_version:
        required: true
        type: string

jobs:
  JOB_codecheck:
    name: codecheck
    steps:
      - name: Checkout
        identifier: process_checkout
        uses: checkout
        with:
          ref: ${{ atomgit.event.pull_request.merge_commit_sha || atomgit.sha }}
          token: ${{ secrets.GIT_TOKEN }}
      - name: get_pr
        identifier: get_pr
        uses: cann/.gitcode/actions/get-pr@master
        with:
          workspace: ${{ steps.process_checkout.outputs.path }}
          target_branch: ${{ env.TARGET_BRANCH }}
          git_token: ${{ secrets.GIT_TOKEN }}
      - name: precommit
        identifier: precommit
        uses: cann/.gitcode/actions/precommit@master
        with:
          merge_id: ${{ env.MERGE_ID }}
          repo_name: ${{ env.repo_name }}
          workspace: ${{ steps.process_checkout.outputs.path }}
      - name: check-pr
        identifier: check-pr
        uses: cann/.gitcode/actions/check-pr@master
        with:
          repo_name: ${{ env.repo_name }}
          workspace: ${{ steps.process_checkout.outputs.path }}
      - name: sca
        run: |
          CI_PATH="${{ env.CI_PATH }}"
          if [ -z "${{ secrets.SCA_AK }}" ] || [ -z "${{ secrets.SCA_SK }}" ] || [ -z "$CI_PATH" ]; then
            echo "SCA_AK/SCA_SK or CI_PATH not configured, skipping sca"
            exit 0
          fi
          cd ${{ steps.process_checkout.outputs.path }}
          git clone --depth=1 "$CI_PATH" CI
          cd CI/scripts
          python3 -m pip install --break-system-packages -q requests
          python3 codescan_gitcode.py --access_key ${{ secrets.SCA_AK }} --secret_access_key ${{ secrets.SCA_SK }} --access_key_get ${{ secrets.SCA_AK_GET }} --secret_access_key_get ${{ secrets.SCA_SK_GET }} --org_name ${{ env.org_name }} --pr_id ${{ env.MERGE_ID }} --repo ${{ env.repo_name }} --commit_id ${{ env.COMMIT_ID }}
      - name: antiposion
        run: |
          CI_PATH="${{ env.CI_PATH }}"
          if [ -z "${{ secrets.ANTI_AK }}" ] || [ -z "${{ secrets.ANTI_SK }}" ] || [ -z "$CI_PATH" ]; then
            echo "ANTI_AK/ANTI_SK or CI_PATH not configured, skipping antiposion"
            exit 0
          fi
          cd ${{ steps.process_checkout.outputs.path }}
          [ -d CI ] || git clone --depth=1 "$CI_PATH" CI
          cd CI/scripts
          python3 -m pip install --break-system-packages -q requests
          python3 anti_virus_gitcode.py --access_key ${{ secrets.ANTI_AK }} --secret_access_key ${{ secrets.ANTI_SK }} --access_key_get ${{ secrets.ANTI_AK_GET }} --secret_access_key_get ${{ secrets.ANTI_SK_GET }} --org_name ${{ env.org_name }} --pr_id ${{ env.MERGE_ID }} --repo ${{ env.repo_name }} --commit_id ${{ env.COMMIT_ID }}
      - name: codecheck
        run: |
          CI_PATH="${{ env.CI_PATH }}"
          if [ -z "${{ secrets.CODECHECK_AK }}" ] || [ -z "${{ secrets.CODECHECK_SK }}" ] || [ -z "$CI_PATH" ]; then
            echo "CODECHECK_AK/CODECHECK_SK or CI_PATH not configured, skipping codecheck"
            exit 0
          fi
          cd ${{ steps.process_checkout.outputs.path }}
          [ -d CI ] || git clone --depth=1 "$CI_PATH" CI
          cd CI/scripts
          python3 -m pip install --break-system-packages -q requests
          python3 codecheck_gitcode.py --access_key ${{ secrets.CODECHECK_AK }} --secret_access_key ${{ secrets.CODECHECK_SK }} --access_key_get ${{ secrets.CODECHECK_AK_GET }} --secret_access_key_get ${{ secrets.CODECHECK_SK_GET }} --org_name ${{ env.org_name }} --pr_id ${{ env.MERGE_ID }} --repo ${{ env.repo_name }} --commit_id ${{ env.COMMIT_ID }}
    if: "${{ default() }}"
    runs-on: ["codearts-hosted", "ubuntu-latest", "x64", "small"]
    container:
      image: swr.cn-north-4.myhuaweicloud.com/ci_cann/${{ inputs.codecheck_image_version }}
